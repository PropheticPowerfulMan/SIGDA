<!doctype html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hors ligne · SIGDA</title>
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem("sigda-theme") === "dark" ? "dark" : "light";
        } catch {
            // Le thème Soleil reste disponible sans préférence enregistrée.
        }
    </script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1828;
            --panel: #12263c;
            --border: #304961;
            --text: #e8eef5;
            --muted: #9eb1c3;
            --accent: #e0c185;
            --primary: #2a5e91;
            --scrollbar-thumb: #7e96ab;
            font-family: "EB Garamond", "Times New Roman", serif;
            font-size: 19px;
        }
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #e5e1d8;
            --panel: #eee9df;
            --border: #cdc2af;
            --text: #25394b;
            --muted: #5c6a72;
            --accent: #785524;
            --primary: #173e61;
            --scrollbar-thumb: #97805b;
        }
        * { box-sizing: border-box; scrollbar-color: var(--scrollbar-thumb) var(--bg); scrollbar-width: thin; }
        @media (forced-colors: active) { * { scrollbar-color: auto; } }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            place-items: center;
            background: var(--bg);
            color: var(--text);
        }
        main {
            width: min(100%, 440px);
            padding: clamp(20px, 6vw, 36px);
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
        }
        .brand { margin: 0; color: var(--accent); font-weight: 700; letter-spacing: .08em; }
        h1 { margin: 10px 0 0; font-size: clamp(1.4rem, 6vw, 1.85rem); line-height: 1.2; }
        p { color: var(--muted); line-height: 1.5; }
        a {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 14px;
            border-radius: 7px;
            background: var(--primary);
            color: #fff;
            font-weight: 650;
            text-decoration: none;
        }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="brand">SIGDA</p>
        <h1>Vous êtes hors ligne</h1>
        <p>Rétablissez la connexion pour accéder à votre espace documentaire.</p>
        <a href="">Réessayer</a>
    </main>
</body>
</html>
